# Builds the ISO and publishes a release.
#
# The ISO is ~4 GB and a GitHub release asset is capped at 2 GiB, so the image
# itself is hosted on SourceForge (free, unlimited, and mirrored) and the
# release here carries the checksums, the notes and the link.
#
# Needs, one time, three repository secrets (Settings -> Secrets and variables
# -> Actions -> Secrets):
#   SOURCEFORGE_SSH_KEY  - private key of a keypair registered on the
#                          SourceForge account, no passphrase
#   SOURCEFORGE_USER     - that account's username
#   SOURCEFORGE_PROJECT  - the project's unix name
# The last two are not really secret, but keeping all three together beats
# splitting them across two settings pages. Actions masks them in the log, so
# the rsync destination and the SourceForge links print as *** there — they are
# written into the release notes correctly.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 0.1.0-rc1)'
        required: true
        type: string
      publish:
        description: 'Upload the ISO and create the release. Off means a build-only dry run.'
        type: boolean
        default: false

# One build at a time: each one downloads several GB and runs for the better
# part of an hour.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Pinned rather than discovered with ssh-keyscan at run time. Verify against
  # SourceForge's published fingerprint before changing:
  # SHA256:209BDmH3jsRyO9UeGPPgLWPSegKmYCBIya0nR/AWWCY
  SF_KNOWN_HOSTS: 'frs.sourceforge.net ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOQD35Ujalhh+JJkPvMckDlhu4dS7WH6NsOJ15iGCJLC'

jobs:
  # The cheap half of a build, as a gate. A bad version, a failing test or a
  # package that has left the repos fails here in about a minute, rather than
  # forty minutes into a pacstrap.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the version
        id: v
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
          else
            version="${{ inputs.version }}"
            publish="${{ inputs.publish }}"
          fi

          # mkarchiso puts this straight into the ISO's filename and metadata.
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "error: '${version}' is not a version of the form 1.2.3 or 1.2.3-rc1" >&2
            exit 1
          fi

          {
            echo "version=${version}"
            echo "tag=v${version}"
            echo "publish=${publish}"
            # A 0.x version, or one with a suffix (-rc1, -beta2), is not a
            # final release: GitHub badges it and does not serve it as Latest.
            if [[ "${version}" == 0.* || "${version}" == *-* ]]; then
              echo "prerelease=true"
            else
              echo "prerelease=false"
            fi
          } >>"${GITHUB_OUTPUT}"

      - uses: actions/setup-go@v7
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum

      - name: Format, vet and test the installer
        working-directory: installer
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "These files need gofmt:" >&2
            echo "${unformatted}" >&2
            exit 1
          fi
          go vet ./...
          go test ./...

      - name: Resolve the package lists
        run: |
          set -euo pipefail
          # build.sh's own preflight, without the build. Needs pacman and the
          # profile's repos, so it runs in the same Arch container the build
          # will use.
          docker run --rm -v "${PWD}:/build" -w /build archlinux:latest \
            bash -euo pipefail -c '
              pacman -Sy --noconfirm --config profile/pacman.conf >/dev/null
              ./build.sh --check-packages
            '

  build:
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # One entry, deliberately. archiso 90 has no aarch64 boot mode (only
        # bios.syslinux, uefi-x64.* and uefi-ia32.*) and Arch Linux has no
        # aarch64 repositories at all, so an ARM ISO is a port to Arch Linux
        # ARM, not another line here. When that exists, it is another line here.
        include:
          - arch: x86_64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Make room on the runner
        run: |
          set -euo pipefail
          # A runner has one 72 GB disk with ~14 GB free, and a build needs
          # around 20: work/ peaks near 9 GB, the ISO is 4, the system image
          # 2.2, the package cache 2.5. (/mnt is a directory on that same disk,
          # not the second disk it used to be.) Everything removed here is
          # preinstalled tooling this build never touches.
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/share/boost \
            /usr/lib/google-cloud-sdk
          sudo docker image prune --all --force >/dev/null
          echo "cores: $(nproc)"
          free -h
          df -h /

      - name: Build the ISO
        env:
          CAIRN_VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          # build.sh needs root, pacstrap's bind mounts and Arch's own tooling,
          # so it runs in a privileged Arch container rather than on the runner.
          docker run --rm --privileged \
            -v "${PWD}:/build" -w /build \
            -e CAIRN_VERSION \
            archlinux:latest \
            bash -euo pipefail -c '
              # Refresh the keyring first: a months-old image keyring rejects
              # packages signed since it was built.
              pacman -Sy --noconfirm --needed archlinux-keyring
              pacman -Su --noconfirm --needed archiso go
              ./build.sh
            '
          sudo chown -R "$(id -u):$(id -g)" out
          df -h /

      - name: Checksum and report
        id: iso
        working-directory: out
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          iso="cairn-${VERSION}-${ARCH}.iso"
          [[ -f "${iso}" ]] || { echo "error: build produced no ${iso}" >&2; ls -l; exit 1; }
          # This copy goes to SourceForge beside the ISO, under the plain name.
          sha256sum "${iso}" >sha256sums.txt

          size="$(du -h "${iso}" | cut -f1)"
          # These two go to the publish job. download-artifact extracts every
          # artifact into one directory, so their names carry the architecture.
          cp sha256sums.txt "sha256sums-${ARCH}.txt"
          {
            echo "iso=${iso}"
            echo "arch=${ARCH}"
            echo "size=${size}"
          } >"meta-${ARCH}.env"
          echo "iso=${iso}" >>"${GITHUB_OUTPUT}"

          {
            echo "### ${iso}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| size | ${size} |"
            echo "| sha256 | \`$(cut -d' ' -f1 sha256sums.txt)\` |"
            echo
            echo "| phase | time |"
            echo "|---|---|"
            awk -F'\t' '{ printf "| %s | %dm%02ds |\n", $1, $2 / 60, $2 % 60 }' build-timings.tsv
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Upload the ISO to SourceForge
        if: needs.check.outputs.publish == 'true'
        working-directory: out
        env:
          SF_USER: ${{ secrets.SOURCEFORGE_USER }}
          SF_PROJECT: ${{ secrets.SOURCEFORGE_PROJECT }}
          SF_SSH_KEY: ${{ secrets.SOURCEFORGE_SSH_KEY }}
          TAG: ${{ needs.check.outputs.tag }}
          ISO: ${{ steps.iso.outputs.iso }}
        run: |
          set -euo pipefail
          : "${SF_USER:?set the SOURCEFORGE_USER repository secret}"
          : "${SF_PROJECT:?set the SOURCEFORGE_PROJECT repository secret}"
          : "${SF_SSH_KEY:?set the SOURCEFORGE_SSH_KEY repository secret}"

          install -d -m 0700 ~/.ssh
          printf '%s\n' "${SF_SSH_KEY}" >~/.ssh/sourceforge
          chmod 0600 ~/.ssh/sourceforge
          printf '%s\n' "${SF_KNOWN_HOSTS}" >~/.ssh/sourceforge_known_hosts

          # rsync creates the release folder itself. --partial --append-verify
          # so a connection dropped at 90% of 4 GB resumes on the next attempt
          # instead of starting the upload — and the build — again.
          for attempt in 1 2 3; do
            if rsync -av --partial --append-verify --timeout=300 \
              -e "ssh -i ${HOME}/.ssh/sourceforge -o UserKnownHostsFile=${HOME}/.ssh/sourceforge_known_hosts -o StrictHostKeyChecking=yes" \
              "${ISO}" sha256sums.txt \
              "${SF_USER}@frs.sourceforge.net:/home/frs/project/${SF_PROJECT}/${TAG}/"; then
              exit 0
            fi
            echo "::warning::rsync attempt ${attempt} failed" >&2
            sleep $((attempt * 30))
          done
          echo "error: could not upload ${ISO} to SourceForge after 3 attempts" >&2
          exit 1

      - name: Keep the checksums for the release
        if: needs.check.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          # Small text files only — the ISO itself never leaves the runner, it
          # goes straight to SourceForge above.
          name: release-${{ matrix.arch }}
          path: |
            out/sha256sums-*.txt
            out/meta-*.env
          retention-days: 7

  # One release, however many architectures built. Nothing here is expensive,
  # so a failed publish can be re-run on its own: the ISOs are already on
  # SourceForge and the checksums are in the artifacts.
  publish:
    needs: [check, build]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The release notes diff against the previous tag.
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          SF_PROJECT: ${{ secrets.SOURCEFORGE_PROJECT }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          # Wherever download-artifact chose to put them: v4 gave each artifact
          # a subdirectory, v8 extracts into the path itself.
          mapfile -t sums < <(find dist -name 'sha256sums-*.txt' | sort)
          mapfile -t metas < <(find dist -name 'meta-*.env' | sort)
          if [[ ${#sums[@]} -eq 0 || ${#metas[@]} -eq 0 ]]; then
            echo "error: the build artifacts carry no checksums:" >&2
            find dist >&2
            exit 1
          fi
          cat "${sums[@]}" >sha256sums.txt

          notes="$(mktemp)"
          {
            # Hand-written notes for this tag, if there are any: what changed
            # that a list of commit subjects cannot say. The generated sections
            # follow it.
            written=".github/release-notes/${TAG}.md"
            if [[ -f "${written}" ]]; then
              cat "${written}"
              echo
            fi
            echo "## Download"
            echo
            for meta in "${metas[@]}"; do
              iso="$(sed -n 's/^iso=//p' "${meta}")"
              arch="$(sed -n 's/^arch=//p' "${meta}")"
              size="$(sed -n 's/^size=//p' "${meta}")"
              echo "**[${iso}](https://downloads.sourceforge.net/project/${SF_PROJECT}/${TAG}/${iso})** — ${size}, ${arch}"
              echo
            done
            echo "Hosted on [SourceForge](https://sourceforge.net/projects/${SF_PROJECT}/files/${TAG}/)"
            echo "because a GitHub release asset cannot exceed 2 GiB."
            echo
            echo "Download the ISO, then check it against the checksums here"
            echo "(\`--ignore-missing\` so it only checks the one you took):"
            echo
            echo '```'
            echo "curl -LO https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/sha256sums.txt"
            echo "sha256sum --ignore-missing -c sha256sums.txt"
            echo '```'
            echo
            echo "Write it to a USB stick — this erases the stick:"
            echo
            echo '```'
            echo "sudo dd if=${iso} of=/dev/sdX bs=4M status=progress oflag=sync"
            echo '```'
            echo
            echo "## Changes"
            echo
            prev="$(git tag --sort=-creatordate | grep -vFx "${TAG}" | head -n1 || true)"
            if [[ -n "${prev}" ]]; then
              git log --no-merges --pretty='- %s' "${prev}..HEAD"
              echo
              echo "[Full diff](https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${TAG})"
            else
              echo "First release."
            fi
            echo
            echo "---"
            echo
            echo "Built by \`.github/workflows/release.yml\` from \`${GITHUB_SHA}\`."
          } >"${notes}"

          # --target creates the tag when this was a manual run; on a tag push
          # the tag is already what we are building.
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "Cairn ${TAG}" \
            --notes-file "${notes}" \
            ${{ needs.check.outputs.prerelease == 'true' && '--prerelease' || '' }} \
            sha256sums.txt
