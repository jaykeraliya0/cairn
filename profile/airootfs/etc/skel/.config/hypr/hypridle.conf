# Idle daemon. Locks via hyprlock, then suspends if left idle further.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}

# Dim the screen after 25 minutes idle, as a warning before the lock at 30.
listener {
    timeout = 1500
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Lock after 30 minutes idle.
listener {
    timeout = 1800
    on-timeout = loginctl lock-session
}

# Suspend after 45 minutes idle. Already locked by this point (lock fires at
# 30 minutes), so it resumes to the lock screen.
listener {
    timeout = 2700
    on-timeout = systemctl suspend
}
