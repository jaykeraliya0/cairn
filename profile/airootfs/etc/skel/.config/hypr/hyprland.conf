# Cairn default Hyprland config -- Last of Us theme.
# Colors: ~/.config/hypr/colors.conf (see the comment there).

source = ~/.config/hypr/colors.conf

monitor = , preferred, auto, 1

$terminal = alacritty
$menu = rofi -show drun
$mainMod = SUPER

exec-once = waybar
exec-once = mako
exec-once = swaybg -i ~/.config/wallpaper.jpg -m fill
exec-once = systemctl --user start hyprpolkitagent.service
exec-once = hypridle

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

general {
    gaps_in = 2
    gaps_out = 4
    border_size = 1
    col.active_border = $active_border
    col.inactive_border = $inactive_border
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 3
    rounding_power = 2

    shadow {
        enabled = true
        range = 14
        render_power = 2
        color = $shadow_color
    }

    blur {
        enabled = true
        size = 4
        passes = 3
        vibrancy = 0
        xray = true
    }
}

animations {
    enabled = true

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1
    bezier = quick, 0.15, 0, 0.1, 1

    animation = global, 1, 10, default
    animation = border, 1, 5.4, easeOutQuint
    animation = windows, 1, 3, easeOutQuint, slide
    animation = windowsIn, 1, 2.5, easeOutQuint, popin 90%
    animation = windowsOut, 1, 2, easeOutQuint, popin 90%
    animation = windowsMove, 1, 2.5, easeOutQuint
    animation = fadeIn, 1, 1.7, almostLinear
    animation = fadeOut, 1, 1.5, almostLinear
    animation = fade, 1, 3, quick
    animation = layers, 1, 3.8, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = workspaces, 1, 1.9, almostLinear, fade
    animation = workspacesIn, 1, 1.2, almostLinear, fade
    animation = workspacesOut, 1, 1.9, almostLinear, fade
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    # Safety: make sure a blanked screen can always be woken by input.
    key_press_enables_dpms = true
    mouse_move_enables_dpms = true
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

# Rules use the block syntax introduced in Hyprland 0.53: one block per rule,
# keyed by `name`, matchers under `match:<prop>`, effects as plain fields.
# The old one-line `layerrule = noanim, ^rofi$` form is gone.
layerrule {
    name = rofi-no-anim
    match:namespace = ^rofi$
    no_anim = true
}

layerrule {
    name = notifications-blur
    match:namespace = ^notifications$
    blur = true
    ignore_alpha = 0.2
}

windowrule {
    name = float-term
    match:title = ^(float-term)$
    float = true
    size = 1000 600
    center = true
}

bind = $mainMod, Return, exec, $terminal
bind = $mainMod SHIFT, Return, exec, $terminal --title float-term
bind = $mainMod, SPACE, exec, $menu

bind = $mainMod, Q, killactive,
bind = $mainMod, T, togglefloating,
bind = $mainMod, F, fullscreen,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, N, exec, makoctl dismiss -a

# Focus movement (arrow keys)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move window with SUPER+SHIFT+arrow
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Workspaces 1-10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshots (region -> save + copy; full screen -> save + copy)
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh region
bind = $mainMod, Print, exec, ~/.config/hypr/scripts/screenshot.sh screen

# Media/volume/brightness
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
