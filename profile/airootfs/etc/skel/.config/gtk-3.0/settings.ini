# GTK appearance. Colors match ~/.config/hypr/colors.lua; see the comment there.
#
# Without this, GTK applications (Firefox, Nautilus, file-roller) start in the
# light Adwaita theme and sit next to a dark desktop looking like a mistake.
# Qt applications are pointed at qt6ct by QT_QPA_PLATFORMTHEME in hyprland.lua.

[Settings]
gtk-theme-name=Adwaita-dark
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=Noto Sans 10
gtk-cursor-theme-size=24
gtk-application-prefer-dark-theme=1
